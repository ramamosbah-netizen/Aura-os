name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Release-proof runs must finish their disposable DB/browser evidence. Cancelling an in-flight
  # proof when a follow-up commit lands leaves required checks red without a product assertion.
  cancel-in-progress: false

jobs:
  verify:
    name: lint · typecheck · test · e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint — TIER-2 #50)
        run: pnpm lint

      - name: ADR registry integrity (no number collisions / registry drift)
        run: pnpm adr:check

      - name: Migration policy (sequential, gap-free, @DOWN on new files — Vol 23 #25)
        run: node scripts/migration-policy-check.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + module tests (coverage — TIER-2 #42)
        run: pnpm test:coverage

      # Sales IA remediation gates. Keep these explicit so ownership regressions remain visible
      # even when the broader workspace test command is reorganized.
      - name: Sales ownership fitness — API permissions, readiness and tenant audit
        run: pnpm --filter @aura/api test -- --run src/crm/negotiation.controller.test.ts src/crm/crm-quotations.security.test.ts src/crm/lead-pipeline-ownership.security.test.ts src/crm/quotation-readiness-migration.fitness.test.ts

      - name: Sales ownership fitness — CRM pricing/baseline lineage
        run: pnpm --filter @aura/crm test -- --run src/quotation.service.test.ts

      - name: Sales ownership fitness — web route, queue and Lead/Pipeline parity
        run: pnpm --filter @aura/web test -- --run crm-sales-route-ownership.fitness.test.ts crm-lead-parity.fitness.test.ts commercial-source-truth.fitness.test.ts components/commercial-ownership.fitness.test.ts

      - name: API HTTP e2e (Supertest — TIER-2 #39/#40)
        # The release-proof suite below is explicitly database-backed and must not run against
        # this tier's forced in-memory adapters. It runs in web-smoke-postgres after migrations.
        run: pnpm --filter @aura/api exec vitest run --config vitest.config.e2e.ts --exclude test/sales-mutation-release-proof.e2e-spec.ts

      # Blocking: the production graph is expected to stay at zero known advisories. SheetJS is
      # pinned to its official patched distribution and DOMPurify is overridden to a fixed release.
      - name: Dependency audit (TIER-2 #43)
        run: pnpm audit --prod

  # P0 #4 (Vol 23): the migration gate — the full chain must apply onto an empty
  # Postgres, be idempotent on rerun, and the built API must boot against the result.
  # P0 #5: the restore drill — seed real data, pg_dump, restore into a fresh database,
  # and verify per-table row counts match. A backup that isn't rehearsed doesn't exist.
  deploy-readiness:
    name: migration gate · boot · restore drill
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16 # migration 0019 needs `create extension vector`
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura
          POSTGRES_DB: aura
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aura -d aura"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://aura:aura@localhost:5432/aura?sslmode=disable
      PGPASSWORD: aura
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migration gate — full chain from zero
        run: node apps/api/scripts/migrate.mjs

      - name: Migration gate — idempotent rerun applies nothing
        run: |
          out=$(node apps/api/scripts/migrate.mjs)
          echo "$out" | tail -n 2
          echo "$out" | grep -q "0 applied" || { echo "::error::migration rerun applied files — the chain is not idempotent"; exit 1; }

      # R1 (G-P0-1): tenant-isolation enforcement. The fitness check fails if any tenant-scoped
      # business table is missing RLS/FORCE/policy; the isolation test proves the policy denies
      # cross-tenant access under a real NON-BYPASSRLS role.
      - name: RLS fitness — every tenant-scoped table is protected
        run: node apps/api/scripts/rls-fitness.mjs

      - name: RLS isolation — cross-tenant access is denied under a non-bypass role
        run: node apps/api/scripts/rls-isolation-test.mjs

      - name: Build the API (workspace deps included)
        run: pnpm exec turbo run build --filter=@aura/api...

      - name: Boot the built API against the migrated database
        run: |
          cd apps/api
          # AUTH_DEV_PASSWORD + AUTH_DEV_ADMIN_USER seed a REAL hashed credential for the two
          # demo accounts. Before the S1 auth rebuild this step ran with neither, and the seed
          # below still authenticated — because login accepted ANY password when
          # AUTH_DEV_PASSWORD was unset. This job was passing *because of* the auth bypass.
          AUTH_JWT_SECRET=ci-drill-secret AUTH_REQUIRED=true PORT=4300 AUTH_DEV_PASSWORD=ci-demo-seed-password AUTH_DEV_ADMIN_USER=u-admin,u-approver nohup node dist/main.js > api.log 2>&1 &
          echo $! > api.pid
          for i in $(seq 1 60); do
            curl -sf http://localhost:4300/api/v1/health > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4300/api/v1/health || { echo '--- api.log'; cat api.log; exit 1; }

      - name: RLS posture — production refuses to boot under a BYPASSRLS role (P0-2)
        run: |
          cd apps/api
          # The CI DB owner ('aura') bypasses RLS. In production, booting against it must fail closed
          # rather than serve with tenant policies inert. Auth is configured so the auth fail-closed
          # gate passes and we actually reach the RLS-posture gate. Expect a non-zero exit + the log.
          set +e
          NODE_ENV=production AUTH_JWT_SECRET=ci-drill-secret PORT=4600 node dist/main.js > api-rls.log 2>&1
          code=$?
          set -e
          grep -qi "bypasses row-level security" api-rls.log || { echo "expected RLS-posture FATAL in log"; cat api-rls.log; exit 1; }
          test "$code" -ne 0 || { echo "expected non-zero exit (refuse to boot open)"; cat api-rls.log; exit 1; }
          echo "✓ production boot refused under a BYPASSRLS role (fail-closed)"

      - name: SDK drift — regenerated client must match the committed one (Vol 23 #21)
        run: |
          SPEC_URL=http://localhost:4300/api/docs-json node scripts/generate-sdk.mjs
          git diff --exit-code packages/sdk/src/generated.ts

      - name: Seed the demo dataset through the live API
        run: AURA_API_URL=http://localhost:4300 SEED_PASS=ci-demo-seed-password node apps/api/scripts/seed-demo.mjs

      # ── R1 activation closure ──────────────────────────────────────────────────────────
      # The steps above run as the DB owner (BYPASSRLS), which proves nothing about enforcement.
      # Here we ACTIVATE the enforced role: grant `aura_app` LOGIN, boot the built API pointed at
      # it, run a representative business write through the full spine (create → event append →
      # outbox relay → tenant-scoped write + read-back), and prove DB-level fail-closed + that the
      # runtime role genuinely cannot bypass RLS. This is the runtime proof R1's DoD requires.
      - name: R1 activation — grant aura_app LOGIN
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE aura_app LOGIN PASSWORD 'aura_app_ci';"

      - name: CRM Activities RLS — same-tenant and cross-tenant proof under aura_app
        run: |
          OWNER_URL="$DATABASE_URL" \
          APP_DATABASE_URL="postgres://aura_app:aura_app_ci@localhost:5432/aura?sslmode=disable" \
            node apps/api/scripts/crm-activities-rls-proof.mjs

      - name: R1 activation — boot the API as aura_app and run a business flow
        run: |
          cd apps/api
          APP_URL="postgres://aura_app:aura_app_ci@localhost:5432/aura?sslmode=disable"
          DATABASE_URL="$APP_URL" PORT=4400 nohup node dist/main.js > api-app.log 2>&1 &
          echo $! > api-app.pid
          for i in $(seq 1 60); do curl -sf http://localhost:4400/api/v1/health > /dev/null && break; sleep 1; done
          curl -sf http://localhost:4400/api/v1/health || { echo '--- api-app.log'; cat api-app.log; exit 1; }
          # representative spine write under aura_app (open mode → dev-tenant)
          resp=$(curl -sf -X POST http://localhost:4400/api/v1/crm/accounts \
            -H 'content-type: application/json' \
            -d '{"name":"RLS Activation Co","status":"prospect","industry":"Test"}') \
            || { echo '::error::business create failed under aura_app'; cat api-app.log; exit 1; }
          echo "$resp"
          echo "$resp" | grep -q '"id"' || { echo '::error::create returned no id under aura_app'; cat api-app.log; exit 1; }
          # read it back — exercises the tenant-scoped read pool under aura_app
          curl -sf "http://localhost:4400/api/v1/crm/accounts" | grep -q 'RLS Activation Co' \
            || { echo '::error::tenant-scoped read failed under aura_app'; cat api-app.log; exit 1; }

      # ── S1-RLS.7: the AUTH chain under the production role ────────────────────────────
      # The step below proves a business write works as aura_app, but with auth OFF. Auth is the
      # path that reads aura_users / auth_credentials / aura_user_mfa — the tables whose RLS
      # posture S1 changed — so it needs its own proof under the enforced role.
      #
      # This is the gap that made S1's earlier verification incomplete: every other job runs the
      # API as the DB owner, which is exempt from ENABLE and therefore cannot fail the way
      # production would. Concretely, it is what catches a cross-tenant boot hydrate — a SELECT
      # with no tenant bound returns ZERO rows under aura_app, and an empty registry would
      # silently read as "everyone is active".
      - name: S1-RLS.7 + S2 — auth chain, session + refresh lifecycle and revocation under aura_app
        run: |
          cd apps/api
          APP_URL="postgres://aura_app:aura_app_ci@localhost:5432/aura?sslmode=disable"
          # Account choice matters here. Every job above shares ONE database (the `aura` service
          # container), and the owner-role boot already seeded credentials for u-admin/u-approver.
          # The seeder deliberately NEVER clobbers an existing password, so pointing this step at
          # u-admin would skip the write and then try to log in with a password the row does not
          # hold — a false failure that says nothing about RLS. We use u-director instead: it is
          # granted the dev admin role at every boot (so the protected-request check below still
          # passes) but carries NO pre-seeded credential, so THIS boot — running as aura_app — is
          # the one that writes it, under FORCE RLS, which is exactly what the step claims to prove.
          DATABASE_URL="$APP_URL" AUTH_JWT_SECRET=ci-app-role-secret AUTH_REQUIRED=true PORT=4500 AUTH_DEV_PASSWORD=ci-app-role-password AUTH_DEV_ADMIN_USER=u-director AUTH_DEFAULT_TENANT=dev-tenant nohup node dist/main.js > api-authrole.log 2>&1 &
          echo $! > api-authrole.pid
          for i in $(seq 1 60); do curl -sf http://localhost:4500/api/v1/health > /dev/null && break; sleep 1; done
          curl -sf http://localhost:4500/api/v1/health || { echo '::error::API did not boot as aura_app with auth on'; cat api-authrole.log; exit 1; }

          # 1. Seeding wrote a real credential THROUGH aura_app under FORCE RLS, and login reads
          #    it back. Fails if the seeder is not tenant-bound or the policy is wrong.
          # NOTE: no `-f` and no `set -e` abort here. `curl -sf` exits 22 on an HTTP error, which
          # under `bash -e` kills the step before the diagnostics below can run — turning a real
          # failure into an unexplained exit code. Capture the status and body, then decide.
          body=$(curl -s -o /tmp/login-body.json -w '%{http_code}' -X POST http://localhost:4500/api/v1/auth/login -H 'content-type: application/json' -d '{"username":"u-director","password":"ci-app-role-password"}' || true)
          echo "login HTTP $body"; cat /tmp/login-body.json || true; echo
          tok=$(grep -o '"token":"[^"]*"' /tmp/login-body.json 2>/dev/null | cut -d'"' -f4 || true)
          test -n "$tok" || { echo '::error::login failed as aura_app — seed or credential read is broken under RLS'; echo '--- api-authrole.log ---'; cat api-authrole.log; exit 1; }
          echo "OK login succeeded under aura_app (tenant-aware seed + per-tenant registry load)"

          # 2. The token authorises a protected request. Exercises the guard, which loads the
          #    tenant registry on demand — the path that replaced the boot hydrate.
          curl -sf -H "Authorization: Bearer $tok" http://localhost:4500/api/v1/crm/accounts > /dev/null || { echo '::error::protected request failed under aura_app'; cat api-authrole.log; exit 1; }
          echo "OK protected request authorised under aura_app (valid session ⇒ token accepted)"

          # 2b. S2 SESSION REVOCATION on real PostgreSQL. The request above proved the sid'd token is
          #     accepted while the session is LIVE. Now revoke the session server-side (logout) and
          #     prove the SAME still-signed, unexpired token is refused — the sid boundary, not exp,
          #     and same-node cache eviction makes it immediate. (Cross-replica is bounded by
          #     AUTH_SESSION_CACHE_TTL_MS, not immediate — not asserted here, deliberately.)
          curl -s -o /dev/null -X POST http://localhost:4500/api/v1/auth/logout -H "Authorization: Bearer $tok"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $tok" http://localhost:4500/api/v1/crm/accounts)
          test "$code" != "200" || { echo "::error::revoked session STILL authorised the protected route (got 200)"; cat api-authrole.log; exit 1; }
          echo "OK revoked session ⇒ protected route refused ($code)"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:4500/api/v1/auth/refresh -H "Authorization: Bearer $tok")
          test "$code" = "401" || { echo "::error::revoked session was refreshable (got $code, expected 401)"; cat api-authrole.log; exit 1; }
          echo "OK revoked session ⇒ refresh refused (401)"

          # 3. Wrong password is still refused — the credential is real, not waved through.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:4500/api/v1/auth/login -H 'content-type: application/json' -d '{"username":"u-director","password":"wrong-password-entirely"}')
          test "$code" = "401" || { echo "::error::wrong password returned $code, expected 401"; exit 1; }
          echo "OK wrong password refused (401)"

          # 4. CROSS-TENANT: the same credential must not authenticate into another tenant. The
          #    requested tenant is untrusted input; RLS scopes the lookup to it, so u-director is
          #    simply not a registered identity there.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:4500/api/v1/auth/login -H 'content-type: application/json' -d '{"username":"u-director","password":"ci-app-role-password","tenantId":"other-tenant"}')
          test "$code" = "401" || { echo "::error::cross-tenant login returned $code, expected 401"; cat api-authrole.log; exit 1; }
          echo "OK cross-tenant login denied (401)"

          # S2 REFRESH: opaque rotation + replay containment + the R1||R1 race, exercised through the
          # REAL rotate transaction over HTTP against this aura_app API on real PostgreSQL.
          AUTH_USER=u-director AUTH_PASS=ci-app-role-password API_URL=http://localhost:4500 \
            node scripts/auth-refresh-verify.mjs || { echo '--- api-authrole.log ---'; cat api-authrole.log; exit 1; }

          kill "$(cat api-authrole.pid)" 2>/dev/null || true

      # ── S2 gate: persistent auth_challenges under the production role ───────────────────────
      # The challenge store moved from a node-pinned Map to migration 0235. This step proves, as
      # aura_app (NOBYPASSRLS, non-owner) with SEPARATE connections, that RLS scopes every path and
      # that the atomic `DELETE … RETURNING` consume is single-winner under a genuine concurrent
      # race — the property a single-connection (PGlite) run cannot establish. See the script header.
      - name: S2 — auth_challenges RLS scoping + concurrent single-use under aura_app
        run: |
          cd apps/api
          DATABASE_URL="postgres://aura_app:aura_app_ci@localhost:5432/aura?sslmode=disable" \
            node scripts/auth-challenge-verify.mjs

      # SessionStore rests on auth_sessions. Prove the DB layer under the production role: RLS
      # tenant isolation, tenant-scoped + single-effect revocation under contention, absolute
      # expiry as a row property. The boundary cache/validate logic is covered by the unit + e2e
      # suites; this is the RLS/concurrency half only reachable on real PostgreSQL as aura_app.
      - name: S2 — auth_sessions RLS scoping + tenant-scoped revocation under aura_app
        run: |
          cd apps/api
          DATABASE_URL="postgres://aura_app:aura_app_ci@localhost:5432/aura?sslmode=disable" \
            node scripts/auth-session-verify.mjs

      # 0235 must roll back and re-apply cleanly (Vol 23 #25 — every new migration carries @DOWN).
      # Runs as the owner (job-level DATABASE_URL) because it DROPs/CREATEs. Re-applies immediately
      # so the database is whole for the restore drill below.
      # Names the migration explicitly. `down` with no argument reverts whatever is NEWEST, so this
      # check silently started reverting a comms migration the moment the branch that added
      # 0236-0241 merged — and then failed while asserting about 0235. Rolling back to a named file
      # unwinds the tip down to it, so the assertion stays about the migration it is named for.
      - name: S2 — 0235 rollback + re-apply is clean
        run: |
          cd apps/api
          node scripts/migrate.mjs down 0235_auth_sessions.sql
          gone=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('auth_challenges','auth_sessions','auth_refresh_tokens');")
          test "$gone" = "0" || { echo "::error::0235 @DOWN left tables behind (count=$gone)"; exit 1; }
          echo "OK 0235 @DOWN dropped all three S2 tables"
          node scripts/migrate.mjs
          back=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('auth_challenges','auth_sessions','auth_refresh_tokens');")
          test "$back" = "3" || { echo "::error::0235 re-apply did not restore all three tables (count=$back)"; exit 1; }
          echo "OK 0235 re-applied cleanly — all three S2 tables present"

      - name: R1 activation — DB-level fail-closed + no-bypass proof under aura_app
        run: |
          APP_URL="postgres://aura_app:aura_app_ci@localhost:5432/aura?sslmode=disable"
          scoped=$(psql "$APP_URL" -tAc "SELECT set_config('app.current_tenant_id','dev-tenant',false); SELECT count(*) FROM public.aura_crm_accounts;" | tail -n1)
          closed=$(psql "$APP_URL" -tAc "SELECT set_config('app.current_tenant_id','',false); SELECT count(*) FROM public.aura_crm_accounts;" | tail -n1)
          echo "aura_app: dev-tenant rows=$scoped · no-context rows=$closed"
          test "$scoped" -gt 0 || { echo '::error::aura_app cannot read its own tenant rows'; exit 1; }
          test "$closed" = "0" || { echo '::error::RLS not fail-closed under aura_app (rows visible with no context)'; exit 1; }
          bypass=$(psql "$APP_URL" -tAc "SELECT rolbypassrls OR rolsuper FROM pg_roles WHERE rolname=current_user;" | tail -n1)
          test "$bypass" = "f" || { echo '::error::runtime role can bypass RLS'; exit 1; }

      - name: R1 activation — stop the aura_app API
        if: always()
        run: kill "$(cat apps/api/api-app.pid)" 2>/dev/null || true

      # ── R2 migration deploy-gate (G-P0-2) ──────────────────────────────────────────────
      # Prove the boot-time schema-drift gate: un-record the latest migration in the ledger so the
      # code is "ahead" of the DB, boot the built API, and assert it goes health-degraded (503) and
      # refuses business routes (503 SCHEMA_MIGRATION_PENDING) instead of 500-ing on a missing
      # column. The ledger row is restored before any assertion so later backup/restore steps see a
      # consistent DB regardless of outcome. (Only the ledger entry is touched — the schema is not.)
      - name: R2 deploy-gate — pending migration ⇒ degraded + business routes refused
        run: |
          cd apps/api
          latest=$(psql "$DATABASE_URL" -tAc "SELECT filename FROM public.aura_migrations ORDER BY filename DESC LIMIT 1" | tr -d '[:space:]')
          echo "Simulating drift by un-recording latest migration: $latest"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM public.aura_migrations WHERE filename='$latest';"
          # AUTO_MIGRATE=off keeps the STRICT gate under test — this step verifies the production
          # behaviour (refuse, don't self-heal). Dev auto-migrate is proven in the next step.
          AUTO_MIGRATE=off PORT=4500 nohup node dist/main.js > api-gate.log 2>&1 &
          echo $! > api-gate.pid
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4500/api/v1/health || true)
            [ "$code" != "000" ] && break; sleep 1
          done
          health_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4500/api/v1/health)
          health_body=$(curl -s http://localhost:4500/api/v1/health)
          biz_code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:4500/api/v1/crm/accounts -H 'content-type: application/json' -d '{"name":"gate","status":"prospect"}')
          biz_body=$(curl -s -X POST http://localhost:4500/api/v1/crm/accounts -H 'content-type: application/json' -d '{"name":"gate","status":"prospect"}')
          echo "health: $health_code $health_body"
          echo "business: $biz_code $biz_body"
          kill "$(cat api-gate.pid)" 2>/dev/null || true
          # restore the ledger BEFORE asserting so a failed assertion can't corrupt later steps
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO public.aura_migrations(filename) VALUES('$latest') ON CONFLICT DO NOTHING;"
          test "$health_code" = "503" || { echo "::error::health not degraded (got $health_code)"; cat api-gate.log; exit 1; }
          echo "$health_body" | grep -q 'degraded' || { echo '::error::health body is not degraded'; exit 1; }
          test "$biz_code" = "503" || { echo "::error::business route not refused (got $biz_code)"; cat api-gate.log; exit 1; }
          echo "$biz_body" | grep -q 'SCHEMA_MIGRATION_PENDING' || { echo '::error::business refusal code missing'; exit 1; }
          echo "✓ deploy-gate: degraded health + business routes refused while a migration is pending"

      # ── P2-1 first-run auto-migrate (dev) ──────────────────────────────────────────────────────
      # Prove the fresh-clone repair: with a migration pending and AUTO_MIGRATE at its dev default,
      # boot must APPLY the pending migration and serve (200) instead of sitting at a dead 503.
      # A throwaway, idempotent probe migration is used so the real schema + ledger are restored to
      # byte-parity afterwards (the later restore drill compares per-table row counts).
      - name: P2-1 dev auto-migrate — pending migration ⇒ applied on boot, app serves
        run: |
          cd apps/api
          probe=9990_ci_auto_migrate_probe.sql
          echo 'create table if not exists public.ci_auto_migrate_probe (id int);' > ../../infrastructure/migrations/$probe
          PORT=4501 nohup node dist/main.js > api-automig.log 2>&1 &
          echo $! > api-automig.pid
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4501/api/v1/health || true)
            [ "$code" != "000" ] && break; sleep 1
          done
          health_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4501/api/v1/health)
          health_body=$(curl -s http://localhost:4501/api/v1/health)
          recorded=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM public.aura_migrations WHERE filename='$probe'" | tr -d '[:space:]')
          echo "health: $health_code $health_body"
          echo "probe recorded: $recorded"
          kill "$(cat api-automig.pid)" 2>/dev/null || true
          # Clean up the probe entirely BEFORE asserting so the restore-drill parity is unaffected
          # regardless of outcome.
          rm -f ../../infrastructure/migrations/$probe
          psql "$DATABASE_URL" -c "DROP TABLE IF EXISTS public.ci_auto_migrate_probe;"
          psql "$DATABASE_URL" -c "DELETE FROM public.aura_migrations WHERE filename='$probe';"
          test "$health_code" = "200" || { echo "::error::auto-migrate did not heal (health $health_code)"; cat api-automig.log; exit 1; }
          test "$recorded" = "1" || { echo "::error::probe migration not applied on boot"; cat api-automig.log; exit 1; }
          echo "✓ dev auto-migrate: pending migration applied on boot, app served 200"

      - name: Freeze the source (stop the API) before backup
        run: |
          kill "$(cat apps/api/api.pid)" || true
          sleep 3

      - name: Orphan scan — seeded deal chain must have zero dangling references
        run: node apps/api/scripts/orphan-scan.mjs --enforce

      - name: Archiver smoke (dry-run — SQL must run; fresh data ⇒ 0 eligible)
        run: node apps/api/scripts/archive-events.mjs

      - name: Backup — pg_dump custom format
        run: pg_dump -h localhost -U aura -d aura -Fc -f aura.dump

      - name: Restore drill — into a fresh database
        run: |
          createdb -h localhost -U aura aura_restore
          pg_restore -h localhost -U aura -d aura_restore --no-owner aura.dump

      - name: Verify — per-table row counts identical, source non-empty
        run: >
          SOURCE_URL="$DATABASE_URL"
          RESTORE_URL="postgres://aura:aura@localhost:5432/aura_restore?sslmode=disable"
          node apps/api/scripts/verify-restore.mjs

      - name: API log on failure
        if: failure()
        run: |
          echo '=== owner API (api.log) ==='; cat apps/api/api.log || true
          echo '=== deploy-gate API (api-gate.log) ==='; cat apps/api/api-gate.log || true
          echo '=== aura_app API (api-app.log) ==='; cat apps/api/api-app.log || true

  # P0 #3: secret scanning — fail the build when a credential-shaped string lands in
  # the diff. Rotation/revocation procedure: docs/runbooks/secrets-rotation.md.
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # P0 #4: the deployable artifacts. Both images build on every PR; pushes to main
  # publish them to GHCR so a tagged, runnable image exists for every main commit.
  docker-images:
    name: docker images (api + web)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Image repositories must be lowercase; github.repository is "Aura-os".
      - name: Compute lowercase image namespace
        id: ns
        run: echo "ns=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and on main, push) the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.ns.outputs.ns }}/api:latest
            ${{ steps.ns.outputs.ns }}/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build (and on main, push) the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.ns.outputs.ns }}/web:latest
            ${{ steps.ns.outputs.ns }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  web-smoke:
    name: web smoke (Playwright — TIER-2 #41)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The web app imports @aura/shared (form engine core), whose package
      # entry points at dist/ — build workspace deps before the dev server.
      - name: Build workspace dependencies
        run: pnpm --filter @aura/web^... build

      - name: Install Chromium
        run: pnpm --filter @aura/web exec playwright install --with-deps chromium

      - name: Accessibility gate (WCAG 2.1 A/AA + keyboard order)
        run: pnpm --filter @aura/web e2e:a11y
        env:
          CI: 'true'

      # Until now this job ran the web server alone, so every spec that wrote through the BFF
      # could only ever pass by not being written. That is the N-04 failure mode — "verified" by
      # checks that cannot exercise the journey. No DATABASE_URL, so the API boots on its
      # in-memory stores: enough to prove a real request/response round trip, nothing to clean up.
      - name: Build and boot the API
        run: |
          pnpm --filter @aura/api... build
          cd apps/api
          # The edge rate limit (G-07) keys on client IP, and every BFF call reaches the API from
          # the Next server's single address, so the whole suite shares one bucket and trips the
          # 300/min default partway through. A browser suite's burst is not a traffic profile;
          # raised here rather than weakened in the product.
          # AUTH ON (G-03 login leg). Setting a verifier engages PermissionsGuard across the whole
          # surface, which is the point: the suite then proves the app works for an AUTHENTICATED
          # user rather than for the dev pass-through actor. Grants only hydrate from Postgres and
          # there is no DATABASE_URL here, so AUTH_SEED_DEV_ADMIN grants the runner the r-admin
          # role in memory. It is refused outright when NODE_ENV=production or a database is
          # configured — see AccessService.seedDevAdminGrant and dev-admin-seed.test.ts.
          RATE_LIMIT_MAX=100000 PORT=4000 AUTH_JWT_SECRET=e2e-only-not-a-real-secret AUTH_DEV_PASSWORD=e2e-password AUTH_SEED_DEV_ADMIN=true AUTH_DEV_ADMIN_USER=u-admin,u-approver nohup node dist/main.js > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4000/api/v1/health >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4000/api/v1/health >/dev/null \
            || { echo "::error::API did not become healthy"; cat api.log; exit 1; }
          # Fail loudly if the verifier did not engage. Otherwise the suite passes while silently
          # testing the unauthenticated path — exactly the gap this is meant to close.
          curl -sf http://localhost:4000/api/v1/auth/status | grep -q '"enabled":true' \
            || { echo "::error::auth did not engage - the suite would run unauthenticated"; cat api.log; exit 1; }

      - name: Build the web app for the E2E servers
        # T23-3G: the suite runs against `next start`, which serves this build instead of compiling
        # routes on demand -- that is what removes the 14.1 GB `next dev` footprint that was
        # cancelling this job. NEXT_DIST_DIR is deliberately unset: ONE build serves both the
        # gate-off and gate-on servers, because WEB_AUTH_REQUIRED is read per request by proxy.ts
        # rather than inlined at build time (verified: one build served :3100 and :3101 at once).
        run: pnpm --filter @aura/web build
      - name: Smoke
        # T23-3D: two sequential phases so only ONE next dev runs at a time. Phase 1 = gate-off
        # (:3100, the 82-spec chromium project) — the heavy phase whose dual-server memory peak
        # forced the job teardown. Phase 2 = gate-on (:3101, web-auth-gate). Both phases run even if
        # the first fails (per-phase output dirs keep each phase's diagnostics); the step fails if
        # EITHER phase failed.
        run: |
          # T23-3E: sample memory AND disk to STDOUT every 5s. A cancelled Smoke step skips every
          # later step, `if: always()` included -- the upload step reports `skipped` with a
          # zero-second span in all three cancelled runs -- so no uploaded artifact can ever
          # explain this failure. The job log is the only channel that survives the signal, and
          # these lines interleave with the [begin]/result stream so the resource state is
          # readable against the exact test in flight. TIER-2 carries it as the surviving baseline.
          ( while :; do
              echo "[res] $(date -u +%H:%M:%S) mem=$(free -m | awk '/^Mem:/{print $3"/"$2"MB used, "$7"MB avail"}') disk=$(df -Pm . | awk 'NR==2{print $4"MB free"}')"
              # T23-3F: and WHICH processes hold it, summed by process name -- chromium and next
              # dev both fan out into many pids, so a flat top-N would hide the real owner. This is
              # what makes a single run name the consumer instead of only showing the total climb.
              echo "[top] $(ps -eo rss=,comm= | awk '{a[$2]+=$1} END {for (k in a) printf "%d %s\n", a[k]/1024, k}' | sort -nr | head -6 | awk '{printf "%s=%sMB ", $2, $1}')"
              sleep 5
            done ) &
          SAMPLER=$!
          set +e
          E2E_SERVER=gate-off pnpm --filter @aura/web exec playwright test --project=chromium
          off=$?
          E2E_SERVER=gate-on pnpm --filter @aura/web exec playwright test --project=auth-gate
          on=$?
          kill "$SAMPLER" 2>/dev/null || true
          wait "$SAMPLER" 2>/dev/null || true
          echo "phase results: gate-off=$off gate-on=$on"
          [ $off -eq 0 ] && [ $on -eq 0 ]
        env:
          # T23-3G: run against the prebuilt production server, not `next dev`.
          E2E_WEB_START: '1'
          CI: 'true'
          AURA_API_URL: http://localhost:4000
          E2E_USERNAME: u-admin
          E2E_PASSWORD: e2e-password
          # A second granted actor. Segregation of duties refuses self-authorisation, so the
          # permit-approval journey needs one principal to request and another to approve.
          E2E_ALT_USERNAME: u-approver

      # Playwright writes a page snapshot (error-context.md) and any trace next to each failure.
      # Without this they die with the runner, so a browser failure that only happens in CI — the
      # ones that matter most, because they cannot be reproduced locally — could only be guessed at
      # from the one-line assertion in the log.
      # always(), not failure(): the Smoke step can end on SIGTERM and be recorded as `cancelled`
      # rather than `failed`, which skipped this upload and left TIER-2 undiagnosable. always()
      # captures the trace/screenshot/report whether the step failed OR was cancelled.
      - name: Playwright failure artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          # Glob: T23-3D writes per-phase dirs (test-results-gate-off / -gate-on) so neither phase
          # overwrites the other's diagnostics.
          path: |
            apps/web/test-results*
            apps/web/playwright-report*
          retention-days: 7
          if-no-files-found: ignore

      - name: API log on failure
        if: failure()
        run: cat apps/api/api.log || true
  # ── TIER-3: the SAME browser suite against a real PostgreSQL ────────────────────────────────
  #
  # TIER-2 above runs the browser suite against the in-memory adapters: fast, and the gate that must
  # stay fast. It cannot see anything that only exists in persistence. Measured 2026-08-19, this tier
  # found four product bugs TIER-2 was structurally blind to — a calendar day shifted by the driver's
  # local-midnight parsing, an upsert arbitrating on the business key so every state transition
  # raised on the primary key, a client-side account sentinel reaching a uuid column, and a duplicate
  # daily report silently overwriting its predecessor in place.
  #
  # Same specs, same assertions; the backend and the runtime identity are what differ.
  web-smoke-postgres:
    name: web smoke TIER-3 (Playwright · PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16 # migration 0019 needs `create extension vector`
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura
          POSTGRES_DB: aura
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aura -d aura"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Two credentials, deliberately separate, exactly as a deployment has them: schema work belongs
      # to the owner, and the application runs as the least-privilege role the RLS policies are
      # written against. Running the app as the owner would make this tier prove less about isolation
      # than the migration gate already does.
      DATABASE_URL: postgres://aura_app:aura_app_ci@localhost:5432/aura?sslmode=disable
      PGPASSWORD: aura
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Compose the owner connection strings
        run: |
          # Built from PGPASSWORD rather than inlined, so the staged-secret scan sees a variable
          # instead of an inline password. The values are the throwaway service-container ones.
          echo "OWNER_URL=postgres://aura:$PGPASSWORD@localhost:5432/aura?sslmode=disable" >> "$GITHUB_ENV"
          echo "MIGRATION_DATABASE_URL=postgres://aura:$PGPASSWORD@localhost:5432/aura?sslmode=disable" >> "$GITHUB_ENV"

      - name: Migrate as the schema owner
        run: node apps/api/scripts/migrate.mjs

      - name: Activate the runtime role
        run: |
          # 0163 creates aura_app NOLOGIN; a deployment grants it a credential as the activation
          # step. Same here, so the API connects as the role the policies actually constrain.
          psql "$OWNER_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE aura_app LOGIN PASSWORD 'aura_app_ci';"

      - name: Mark this database disposable
        run: |
          # The suite refuses a database-backed API unless the DATABASE itself says it is a
          # throwaway — an environment variable alone is only a claim by whoever typed the command,
          # and would still be "true" beside the wrong DATABASE_URL. No migration creates this
          # table, so every real database answers `unmarked` by default and is refused without
          # anyone having to remember anything. This container was created seconds ago by this job.
          psql "$OWNER_URL" -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS public.aura_environment (marker text PRIMARY KEY); INSERT INTO public.aura_environment (marker) VALUES ('e2e-disposable') ON CONFLICT DO NOTHING; GRANT SELECT ON public.aura_environment TO aura_app;"

      - name: Grant the actors the suite needs
        run: |
          # u-admin gets its wildcard from the boot seeder, which persists grants when a database is
          # configured. The other two actors must NOT, or the specs that depend on them pass for the
          # wrong reason. No shipped role carries these permissions, so the roles are seeded here
          # rather than widening an ELV one; roles hydrate from aura_access_roles at boot.
          #
          #   u-e2e-checker  hse + e2e-chat-reader
          #     Segregation of duties needs a requester who is not the approver. It also needs
          #     comms.channel.read: without it PermissionsGuard refuses before any channel lookup,
          #     so the DM privacy spec sees 403 for a real channel and an invented id alike — safe,
          #     but it never reaches the 404-concealment path it exists to protect.
          #
          #   u-e2e-viewer   e2e-viewer (workspace.me.read only)
          #     The restricted identity global-shell-home asserts: role "viewer", isAdmin false, one
          #     suite, no Admin link, administration-governance forbidden. u-approver satisfies that
          #     in TIER-2, but only because the workspace directory defaults unassigned users to
          #     viewer while it separately holds a wildcard grant — an identity that reads as
          #     restricted on one axis and unrestricted on another. This one is restricted on both.
          psql "$OWNER_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO public.aura_access_roles (id, name, permissions, updated_at) VALUES ('e2e-chat-reader', 'E2E chat reader', '[\"comms.channel.read\"]'::jsonb, now()), ('e2e-viewer', 'E2E viewer', '[\"workspace.me.read\"]'::jsonb, now()) ON CONFLICT (id) DO UPDATE SET permissions = excluded.permissions, updated_at = now();"
          psql "$OWNER_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO public.aura_access_grants (user_id, role_id, scope_key, scope, updated_at) VALUES ('u-e2e-checker', 'hse', 'org:tenant:dev-tenant', '{\"kind\":\"org\",\"level\":\"tenant\",\"id\":\"dev-tenant\"}'::jsonb, now()), ('u-e2e-checker', 'e2e-chat-reader', 'org:tenant:dev-tenant', '{\"kind\":\"org\",\"level\":\"tenant\",\"id\":\"dev-tenant\"}'::jsonb, now()), ('u-e2e-viewer', 'e2e-viewer', 'org:tenant:dev-tenant', '{\"kind\":\"org\",\"level\":\"tenant\",\"id\":\"dev-tenant\"}'::jsonb, now()) ON CONFLICT (user_id, role_id, scope_key) DO NOTHING;"

      - name: Build workspace dependencies
        run: pnpm --filter @aura/web^... build

      - name: Install Chromium
        run: pnpm --filter @aura/web exec playwright install --with-deps chromium

      - name: Build and boot the API as aura_app
        run: |
          # The API needs its WORKSPACE DEPENDENCIES built, not just itself: the '...' suffix
          # includes them. Building only apps/api leaves @aura/core and friends unresolved and
          # tsc fails with 540 "Cannot find module" errors before the database is ever touched.
          pnpm --filter @aura/api... build
          cd apps/api
          # Same auth posture as TIER-2, so the tiers differ in the backend rather than the config.
          RATE_LIMIT_MAX=100000 PORT=4000 AUTH_JWT_SECRET=e2e-only-not-a-real-secret \
            AUTH_DEV_PASSWORD=e2e-password \
            AUTH_DEV_ADMIN_USER=u-admin,u-e2e-checker,u-e2e-viewer \
            nohup node dist/main.js > api-pg.log 2>&1 &
          echo $! > api-pg.pid
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/api/v1/health || true)
            [ "$code" != "000" ] && break; sleep 1
          done
          health=$(curl -sf http://localhost:4000/api/v1/health || true)
          echo "$health"
          echo "$health" | grep -q '"upToDate":true' \
            || { echo "::error::API did not come up against a migrated database"; cat api-pg.log; exit 1; }
          # The schema must be REAL here. An in-memory boot reports "applied":null and would make
          # this tier a slower copy of TIER-2 that silently proves nothing.
          echo "$health" | grep -q '"applied":null' \
            && { echo "::error::the API booted in-memory - TIER-3 must run against the database"; exit 1; }
          # The suite refuses a database-backed API that does not identify itself as disposable,
          # so a marker that failed to reach the API must fail HERE, with that reason, rather
          # than later as a confusing global-setup refusal.
          echo "$health" | grep -q '"environment":"e2e-disposable"' \
            || { echo "::error::the API does not report this database as disposable - the suite would refuse to run"; exit 1; }
          curl -sf http://localhost:4000/api/v1/auth/status | grep -q '"enabled":true' \
            || { echo "::error::auth did not engage - the suite would run unauthenticated"; cat api-pg.log; exit 1; }

      - name: Prove the API itself runs as the least-privilege role
        run: |
          # Three independent facts, because the obvious check proves the weakest one.
          #
          #   (a) the ROLE's attributes            — psql on the app URL
          #   (b) the API's OWN connection         — the API reports the role it actually connected
          #                                          as, from evaluateRlsPosture at boot
          #   (c) who really holds connections     — asked through the OWNER connection, so it is
          #                                          not the app vouching for itself
          #
          # (a) alone would pass even if the API were quietly using some other credential.
          who=$(psql "$DATABASE_URL" -tAc "SELECT current_user;" | tr -d '[:space:]')
          bypass=$(psql "$DATABASE_URL" -tAc "SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname = current_user;" | tr -d '[:space:]')
          echo "(a) role on DATABASE_URL: $who - superuser-or-bypassrls: $bypass"
          test "$who" = "aura_app" || { echo "::error::DATABASE_URL does not resolve to aura_app (got $who)"; exit 1; }
          test "$bypass" = "f" || { echo "::error::the runtime role can bypass RLS - this tier proves nothing about isolation"; exit 1; }

          echo "(b) the API's own posture line:"
          grep -F 'RLS posture' apps/api/api-pg.log || { echo "::error::the API never reported its RLS posture"; exit 1; }
          grep -F 'RLS posture' apps/api/api-pg.log | grep -q 'aura_app' \
            || { echo "::error::the API did not report aura_app as its database role"; exit 1; }
          grep -F 'RLS posture' apps/api/api-pg.log | grep -q 'non-BYPASSRLS' \
            || { echo "::error::the API did not report a non-BYPASSRLS role"; exit 1; }

          # (c) The API has served requests by now, so its pool is connected. Ask the owner which
          # roles actually hold sessions — the app cannot fake this one about itself.
          holders=$(psql "$OWNER_URL" -tAc "SELECT DISTINCT usename FROM pg_stat_activity WHERE datname = 'aura' AND usename IS NOT NULL AND pid <> pg_backend_pid();" | tr -d ' ' | sort | tr '\n' ' ')
          echo "(c) roles holding live sessions: $holders"
          echo "$holders" | grep -q 'aura_app' \
            || { echo "::error::no live session belongs to aura_app - the API is connecting as something else"; exit 1; }

      - name: Prove the second actor is genuinely limited
        run: |
          # Segregation of duties only means something if the two actors differ in AUTHORITY.
          # u-approver is a wildcard admin by design (the boot seeder persists dealChainAdmin for it
          # when a database is configured), so a suite using it would pass because the workflow
          # refuses self-authorisation - not because the requester lacks the approver's rights.
          grants=$(psql "$OWNER_URL" -tAc "SELECT string_agg(role_id, ',' ORDER BY role_id) FROM public.aura_access_grants WHERE user_id = 'u-e2e-checker';" | tr -d '[:space:]')
          echo "grants held by u-e2e-checker: '$grants'"
          test "$grants" = "e2e-chat-reader,hse" || { echo "::error::u-e2e-checker should hold exactly e2e-chat-reader + hse, holds '$grants'"; exit 1; }

          viewer_grants=$(psql "$OWNER_URL" -tAc "SELECT string_agg(role_id, ',' ORDER BY role_id) FROM public.aura_access_grants WHERE user_id = 'u-e2e-viewer';" | tr -d '[:space:]')
          echo "grants held by u-e2e-viewer: '$viewer_grants'"
          test "$viewer_grants" = "e2e-viewer" || { echo "::error::u-e2e-viewer should hold exactly the e2e-viewer role, holds '$viewer_grants'"; exit 1; }

          # Neither test identity may reach a wildcard, however it was granted. A role that quietly
          # gains '*' would leave every one of these assertions technically true and meaningless.
          wild=$(psql "$OWNER_URL" -tAc "SELECT count(*) FROM public.aura_access_grants g JOIN public.aura_access_roles r ON r.id = g.role_id WHERE g.user_id IN ('u-e2e-checker','u-e2e-viewer') AND r.permissions ? '*';" | tr -d '[:space:]')
          echo "wildcard roles reachable by the limited actors: $wild"
          test "$wild" = "0" || { echo "::error::a limited test actor can reach a wildcard role"; exit 1; }

          token=$(curl -s -X POST http://localhost:4000/api/v1/auth/login \
            -H 'content-type: application/json' \
            -d '{"username":"u-e2e-checker","password":"e2e-password"}' | jq -r '.token // empty')
          test -n "$token" || { echo "::error::the limited actor could not sign in"; cat apps/api/api-pg.log; exit 1; }

          # POSITIVE: it can reach its own domain. A READ, deliberately — a write would need a valid
          # project the limited actor cannot create, and a validation failure would then look
          # exactly like a permission failure. This asks the authorization question and nothing else.
          allowed=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/api/v1/hse/ptws -H "Authorization: Bearer $token")
          echo "positive (hse read): $allowed"
          test "$allowed" = "200" || { echo "::error::the limited actor cannot reach its own domain (got $allowed)"; exit 1; }

          # NEGATIVE: and it is refused an admin-only action. 403, not 401 - it IS authenticated.
          refused=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/api/v1/admin/users \
            -H "Authorization: Bearer $token")
          echo "negative (admin read): $refused"
          test "$refused" = "403" || { echo "::error::the limited actor was not refused an admin-only action (got $refused)"; exit 1; }

      - name: Sales mutation release proof (DB-backed PostgreSQL)
        # This suite is intentionally opt-in: it creates namespaced tenants/actors, proves the
        # canonical Sales mutation journeys against the migrated disposable database, and cleans
        # only its own run. Keep it beside the real PostgreSQL/browser proof, never in TIER-2's
        # in-memory API e2e job.
        run: pnpm --filter @aura/api exec vitest run --config vitest.config.e2e-db.ts test/sales-mutation-release-proof.e2e-spec.ts
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}

      - name: Build the web app for the E2E servers
        # T23-3G: the suite runs against `next start`, which serves this build instead of compiling
        # routes on demand -- that is what removes the 14.1 GB `next dev` footprint that was
        # cancelling this job. NEXT_DIST_DIR is deliberately unset: ONE build serves both the
        # gate-off and gate-on servers, because WEB_AUTH_REQUIRED is read per request by proxy.ts
        # rather than inlined at build time (verified: one build served :3100 and :3101 at once).
        run: pnpm --filter @aura/web build
      - name: Sales browser surface proof (existing Playwright specs)
        # Run only the existing Sales-facing browser coverage before the broad smoke suite. This
        # keeps Sales evidence observable even when an unrelated downstream smoke spec fails.
        # No Project Delivery specs are selected here, and the same disposable DB/API credentials
        # and global safety gate are used as the full TIER-3 run.
        run: >-
          pnpm --filter @aura/web exec playwright test
          global-shell-home.spec.ts home-workspace-launcher.spec.ts customers-workspace.spec.ts
          favorites-toggle.spec.ts spine-journey.spec.ts --project=chromium
          --grep "Sales|suite launcher|Customers workspace|favourit|account: create|opportunity: create|quotation: create|contract: create"
        env:
          CI: 'true'
          # T23-3G: this step also drives the main config, so it uses the same prebuilt server.
          E2E_WEB_START: '1'
          AURA_API_URL: http://localhost:4000
          E2E_USERNAME: u-admin
          E2E_PASSWORD: e2e-password
          E2E_ALT_USERNAME: u-e2e-checker
          E2E_VIEWER_USERNAME: u-e2e-viewer
          E2E_DISPOSABLE_DB: '1'
          E2E_EXPECT_TIMEOUT: '30000'
          E2E_TEST_TIMEOUT: '120000'

      - name: Smoke
        # T23-3D: same two sequential phases as TIER-2 (see that job) — gate-off (:3100) then
        # gate-on (:3101), one next dev at a time. Both run; the step fails if either phase failed.
        run: |
          # T23-3E: sample memory AND disk to STDOUT every 5s. A cancelled Smoke step skips every
          # later step, `if: always()` included -- the upload step reports `skipped` with a
          # zero-second span in all three cancelled runs -- so no uploaded artifact can ever
          # explain this failure. The job log is the only channel that survives the signal, and
          # these lines interleave with the [begin]/result stream so the resource state is
          # readable against the exact test in flight. TIER-2 carries it as the surviving baseline.
          ( while :; do
              echo "[res] $(date -u +%H:%M:%S) mem=$(free -m | awk '/^Mem:/{print $3"/"$2"MB used, "$7"MB avail"}') disk=$(df -Pm . | awk 'NR==2{print $4"MB free"}')"
              # T23-3F: and WHICH processes hold it, summed by process name -- chromium and next
              # dev both fan out into many pids, so a flat top-N would hide the real owner. This is
              # what makes a single run name the consumer instead of only showing the total climb.
              echo "[top] $(ps -eo rss=,comm= | awk '{a[$2]+=$1} END {for (k in a) printf "%d %s\n", a[k]/1024, k}' | sort -nr | head -6 | awk '{printf "%s=%sMB ", $2, $1}')"
              sleep 5
            done ) &
          SAMPLER=$!
          set +e
          E2E_SERVER=gate-off pnpm --filter @aura/web exec playwright test --project=chromium
          off=$?
          E2E_SERVER=gate-on pnpm --filter @aura/web exec playwright test --project=auth-gate
          on=$?
          kill "$SAMPLER" 2>/dev/null || true
          wait "$SAMPLER" 2>/dev/null || true
          echo "phase results: gate-off=$off gate-on=$on"
          [ $off -eq 0 ] && [ $on -eq 0 ]
        env:
          # T23-3G: run against the prebuilt production server, not `next dev`.
          E2E_WEB_START: '1'
          CI: 'true'
          AURA_API_URL: http://localhost:4000
          E2E_USERNAME: u-admin
          E2E_PASSWORD: e2e-password
          # A deliberately LIMITED second actor (HSE only) - see the grant step above.
          E2E_ALT_USERNAME: u-e2e-checker
          # The restricted identity global-shell-home measures - limited on BOTH axes.
          E2E_VIEWER_USERNAME: u-e2e-viewer
          # Half of the disposable proof; the other half is the marker in the database itself.
          E2E_DISPOSABLE_DB: '1'
          # Every assertion here sits behind SQL round-trips rather than a Map lookup.
          E2E_EXPECT_TIMEOUT: '30000'
          E2E_TEST_TIMEOUT: '120000'

      # always(), not failure(): see the TIER-2 note — a SIGTERM'd Smoke step is `cancelled`, not
      # `failed`, so failure() skipped this and left TIER-3 undiagnosable.
      - name: Playwright failure artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-postgres
          # Glob: per-phase dirs (test-results-gate-off / -gate-on), same as TIER-2.
          path: |
            apps/web/test-results*
            apps/web/playwright-report*
          retention-days: 7
          if-no-files-found: ignore

      - name: API log on failure
        if: failure()
        run: cat apps/api/api-pg.log || true

  crm-volume-proof:
    name: CRM Customers production-volume proof
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura
          POSTGRES_DB: aura
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aura -d aura"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://aura_app:aura_app_ci@localhost:5432/aura?sslmode=disable
      PGPASSWORD: aura
      VOLUME_TENANT: dev-tenant
      AUTH_DEV_PASSWORD: e2e-password
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Compose disposable connection strings
        run: |
          echo "OWNER_URL=postgres://aura:${PGPASSWORD}@localhost:5432/aura?sslmode=disable" >> "$GITHUB_ENV"
      - name: Migrate disposable database
        run: node apps/api/scripts/migrate.mjs
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
      - name: Activate runtime role
        run: psql "$OWNER_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE aura_app LOGIN PASSWORD 'aura_app_ci';"
      - name: Mark disposable database
        run: psql "$OWNER_URL" -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS public.aura_environment (marker text PRIMARY KEY); INSERT INTO public.aura_environment (marker) VALUES ('crm-volume-disposable') ON CONFLICT DO NOTHING; GRANT SELECT ON public.aura_environment TO aura_app;"
      - name: Build and boot API
        run: |
          pnpm --filter @aura/api... build
          cd apps/api
          RATE_LIMIT_MAX=100000 PORT=4000 AUTH_JWT_SECRET=e2e-only-not-a-real-secret AUTH_DEV_PASSWORD=e2e-password AUTH_DEV_ADMIN_USER=u-admin nohup node dist/main.js > volume-api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4000/api/v1/health >/dev/null && break; sleep 1; done
          curl -sf http://localhost:4000/api/v1/health >/dev/null || { cat volume-api.log; exit 1; }
      - name: Seed and measure production-volume baseline
        run: node apps/api/scripts/crm-volume-proof.mjs
        env:
          AURA_API_URL: http://localhost:4000
      - name: API log on failure
        if: failure()
        run: cat apps/api/volume-api.log || true

  crm-radar-release-proof:
    name: CRM Radar disposable release proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura
          POSTGRES_DB: aura
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aura -d aura"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PGPASSWORD: aura
      RADAR_PROOF_TENANT: radar-proof-a
      RADAR_PROOF_SIGNAL_COUNT: 6001
      AUTH_DEV_PASSWORD: e2e-password
      AUTH_DEV_ADMIN_USER: u-admin,u-viewer
      AUTH_DEV_ADMIN_TENANT: radar-proof-a
      AUTH_DEFAULT_TENANT: radar-proof-a
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Compose disposable connection strings
        run: |
          echo "OWNER_URL=postgres://aura:${PGPASSWORD}@localhost:5432/aura?sslmode=disable" >> "$GITHUB_ENV"
          echo "APP_DATABASE_URL=postgres://aura_app:aura_app_ci@localhost:5432/aura?sslmode=disable" >> "$GITHUB_ENV"
          echo "MIGRATION_DATABASE_URL=postgres://aura:${PGPASSWORD}@localhost:5432/aura?sslmode=disable" >> "$GITHUB_ENV"
      - name: Migrate disposable database from zero through 0266
        run: node apps/api/scripts/migrate.mjs
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
      - name: Activate runtime role and mark database disposable
        run: |
          psql "$OWNER_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE aura_app LOGIN PASSWORD 'aura_app_ci';"
          psql "$OWNER_URL" -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS public.aura_environment (marker text PRIMARY KEY); INSERT INTO public.aura_environment (marker) VALUES ('e2e-disposable') ON CONFLICT DO NOTHING; GRANT SELECT ON public.aura_environment TO aura_app;"
      - name: Build and boot API as aura_app
        run: |
          pnpm --filter @aura/api... build
          cd apps/api
          DATABASE_URL="$APP_DATABASE_URL" AUTH_REQUIRED=true AUTH_JWT_SECRET=radar-proof-only AUTH_DEV_PASSWORD="$AUTH_DEV_PASSWORD" AUTH_DEV_ADMIN_USER="$AUTH_DEV_ADMIN_USER" AUTH_DEFAULT_TENANT="$AUTH_DEFAULT_TENANT" RATE_LIMIT_MAX=100000 PORT=4000 nohup node dist/main.js > radar-api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4000/api/v1/health >/dev/null && break; sleep 1; done
          curl -sf http://localhost:4000/api/v1/health >/dev/null || { cat radar-api.log; exit 1; }
      - name: Run Radar PostgreSQL/RLS/volume/query-plan proof
        run: node apps/api/scripts/crm-radar-release-proof.mjs
        env:
          OWNER_URL: ${{ env.OWNER_URL }}
          APP_DATABASE_URL: ${{ env.APP_DATABASE_URL }}
          AURA_API_URL: http://localhost:4000
      - name: Build web dependencies and install Chromium
        run: |
          pnpm --filter @aura/web^... build
          pnpm --filter @aura/web exec playwright install --with-deps chromium
      - name: Run isolated authenticated Radar browser proof
        run: pnpm --filter @aura/web exec playwright test radar-release-proof.spec.ts --project=chromium
        env:
          AURA_API_URL: http://localhost:4000
          E2E_DISPOSABLE_DB: '1'
          E2E_USERNAME: u-admin
          E2E_PASSWORD: e2e-password
          E2E_TEST_TIMEOUT: '120000'
          E2E_EXPECT_TIMEOUT: '30000'
      # Radar was the one browser gate with NO Playwright evidence upload — a failure left only the
      # API log. Same failure-safe upload as web-smoke / web-smoke-postgres so a red radar gate is
      # diagnosable from its trace + screenshot + error-context instead of guessed at.
      - name: Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-radar
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore
      - name: API log on failure
        if: failure()
        run: cat apps/api/radar-api.log || true
